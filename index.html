<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ayeyarwady Weather Times V3</title>

  <meta name="theme-color" content="#0f172a">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Splash -->
<div id="splash">
  <h1>🌊 Ayeyarwady Weather Times</h1>
  <p>Version 3</p>
</div>

<!-- Header -->
<header>

<h1>🌊 Ayeyarwady Weather</h1>

<button id="themeBtn">
🌙
</button>

</header>

<!-- Search -->

<section class="search">

<input
type="text"
id="searchInput"
placeholder="မြို့ / ရွာ ရှာရန်">

<button id="gpsBtn">
📍
</button>

</section>

<!-- Current Weather -->

<section class="card">

<h2 id="locationName">
ပုသိမ်
</h2>

<div id="temperature">
--°C
</div>

<div id="weatherText">
Loading...
</div>

</section>

<!-- AI -->

<section class="card">

<h2>
🤖 AI Analysis
</h2>

<p id="aiText">

Loading...

</p>

</section>

<!-- Alerts -->

<section class="card">

<h2>
⚠ သတိပေးချက်
</h2>

<div id="floodAlert">

ရေကြီးအခြေအနေ...

</div>

<div id="cycloneAlert">

မုန်တိုင်းအခြေအနေ...

</div>

</section>

<!-- Forecast -->

<section class="card">

<h2>

📅 ၇ ရက်စာ

</h2>

<div id="forecast">

</div>

</section>

<!-- River -->

<section class="card">

<h2>

🌊 River & Tide

</h2>

<div id="riverInfo">

Loading...

</div>

</section>

<!-- Water Transport -->

<section class="card">

<h2>

🚤 Water Transport

</h2>

<div id="transportInfo">

Loading...

</div>

</section>

<!-- Articles -->

<section class="card">

<h2>

🌾 Articles

</h2>

<div id="articleList">

Loading...

</div>

</section>

<footer>

<p>

© Ayeyarwady Weather Times V3

</p>

</footer>

<script src="script.js"></script>

</body>
  </html>
